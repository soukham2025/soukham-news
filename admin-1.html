<!doctype html>
<html lang="as"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>চৌখাম Admin</title>
<style>body{font-family:system-ui,sans-serif;max-width:850px;margin:auto;padding:16px;background:#f3f6fb;color:#172033}section{background:white;padding:18px;margin:14px 0;border-radius:12px}label{display:block;margin-top:10px}input,textarea,select{width:100%;padding:10px;box-sizing:border-box;margin-top:4px}textarea{min-height:90px}button{padding:10px 14px;margin:8px 5px 0 0;cursor:pointer;background:#176b45;color:white;border:0;border-radius:7px}.danger{background:#b42318}.hidden{display:none}.item{border-top:1px solid #ddd;padding:12px 0}.note{color:#555;font-size:.92rem}</style></head><body>
<div style="background:#123b2a;color:white;padding:20px;border-radius:12px"><h1>চৌখাম — Admin Panel</h1><p>Firebase-ত লগইন কৰি বাতৰি যোগ, সম্পাদনা আৰু মচক।</p></div>
<section id="configSection" class="hidden"><h2>Firebase সংযোগ</h2><p id="cfgmsg">Firebase-ত সংযোগ কৰা হৈছে…</p></section>
<section id="login" class="hidden"><h2>Admin লগইন</h2><label>ইমেইল<input id="email" type="email" value="soukham2025@gmail.com"></label><label>পাছৱৰ্ড<input id="password" type="password" autocomplete="current-password"></label><button id="signin">লগইন</button><button id="signout">লগআউট</button><p id="authmsg"></p></section>
<section id="editor" class="hidden"><h2 id="formtitle">নতুন বাতৰি</h2><form id="form"><input id="docid" type="hidden"><label>শিৰোনাম *<input id="title" required maxlength="180"></label><label>ধৰণ<select id="category"><option>লিখিত বাতৰি</option><option>ভিডিঅ’</option><option>ফটো</option></select></label><label>সাৰাংশ<textarea id="summary"></textarea></label><label>সম্পূৰ্ণ বাতৰি / বিৱৰণ<textarea id="body"></textarea></label><label>ছবিৰ URL (ঐচ্ছিক)<input id="imageUrl" type="url"></label><label>ভিডিঅ’ URL (ঐচ্ছিক)<input id="mediaUrl" type="url" placeholder="YouTube লিংক"></label><button type="submit">সংৰক্ষণ কৰক</button><button type="button" id="clear">ফৰ্ম খালী কৰক</button><p id="savemsg"></p></form></section>
<section id="listing" class="hidden"><h2>সংৰক্ষিত বাতৰি</h2><button id="refresh">পুনৰ লওক</button><div id="items"></div></section>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDYNjFI2NTyK1q4K9_TlFb3z7-3rdBynZY",authDomain:"soukham-news.firebaseapp.com",projectId:"soukham-news",messagingSenderId:"893284902586",appId:"1:893284902586:web:768e098455d811b4960483"};
let auth,db,user;const $=id=>document.getElementById(id);
function startFirebase(){try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();$('login').classList.remove('hidden');$('cfgmsg').textContent='Firebase সংযোগ হৈছে। এতিয়া Admin লগইন কৰক।';auth.onAuthStateChanged(u=>{user=u;['editor','listing'].forEach(id=>$(id).classList.toggle('hidden',!u));$('authmsg').textContent=u?'লগইন সফল: '+u.email:'লগইন কৰা হোৱা নাই';if(u)load()})}catch(e){$('configSection').classList.remove('hidden');$('cfgmsg').textContent='Firebase সংযোগত সমস্যা: '+e.message}}
$('signin').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);$('password').value=''}catch(e){$('authmsg').textContent='লগইন ব্যৰ্থ: '+e.message}};
$('signout').onclick=()=>auth.signOut();
function clearForm(){$('form').reset();$('docid').value='';$('formtitle').textContent='নতুন বাতৰি';$('savemsg').textContent=''}$('clear').onclick=clearForm;
$('form').onsubmit=async e=>{e.preventDefault();if(!user)return;let d={title:$('title').value.trim(),category:$('category').value,summary:$('summary').value.trim(),body:$('body').value.trim(),imageUrl:$('imageUrl').value.trim(),mediaUrl:$('mediaUrl').value.trim(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:user.email};try{if($('docid').value)await db.collection('news').doc($('docid').value).set(d,{merge:true});else{d.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('news').add(d)}$('savemsg').textContent='বাতৰি সংৰক্ষণ হ’ল।';clearForm();load()}catch(e){$('savemsg').textContent='সংৰক্ষণ ব্যৰ্থ: '+e.message}};
async function load(){try{let s=await db.collection('news').orderBy('updatedAt','desc').limit(100).get(),root=$('items');root.replaceChildren();if(s.empty){root.textContent='এতিয়ালৈ কোনো বাতৰি নাই।';return}s.forEach(doc=>{let d=doc.data(),box=document.createElement('div');box.className='item';let h=document.createElement('h3');h.textContent=d.title||'শিৰোনাম নাই';let p=document.createElement('p');p.textContent=(d.category||'')+' '+(d.summary||'');let edit=document.createElement('button');edit.textContent='সম্পাদনা';edit.onclick=()=>{$('docid').value=doc.id;['title','category','summary','body','imageUrl','mediaUrl'].forEach(k=>$(k).value=d[k]||'');$('formtitle').textContent='বাতৰি সম্পাদনা';window.scrollTo({top:$('editor').offsetTop,behavior:'smooth'})};let del=document.createElement('button');del.className='danger';del.textContent='মচক';del.onclick=async()=>{if(confirm('এই বাতৰিটো মচিবনে?')){try{await db.collection('news').doc(doc.id).delete();load()}catch(e){alert(e.message)}}};box.append(h,p,edit,del);root.append(box)})}catch(e){$('authmsg').textContent='তালিকা ল’ব পৰা নগ’ল: '+e.message}}
$('refresh').onclick=load;startFirebase();
</script></body></html>
